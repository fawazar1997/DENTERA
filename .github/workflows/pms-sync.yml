# The finance robot: copies the clinic system's (PMS) reports to the
# financial dashboard. Needs the repository secrets PMS_USER, PMS_PASSWORD
# (a read-only PMS account) and FINANCE_INGEST_KEY (the same value as the
# site's Vercel variable). Logs show step names only, never figures.
name: PMS finance sync

on:
  schedule:
    # Twice a day, off the hour (GitHub may delay or drop runs set exactly on
    # the hour): 1:17 am Riyadh (22:17 UTC the evening before) and 10:07 am
    # Riyadh (07:07 UTC), each importing the day before. The morning run also
    # catches up if the night one was dropped; a resend replaces the same
    # day, so nothing is counted twice.
    - cron: "17 22 * * *"
    - cron: "7 7 * * *"
  # NOTE: never put «[skip ci]» in a commit message on this branch — when the
  # latest commit says skip, GitHub skips the scheduled runs too.
  # While the robot is being set up: a change to its steps on the working
  # branch runs «discover» (prints the report pages' fields, never data).
  push:
    branches: [claude/dentera-website-admin-panel-64epvc]
    paths: [scripts/pms-robot.config.json, scripts/pms-robot.mjs, scripts/robot-safety.mjs, .github/workflows/pms-sync.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: "yesterday, today, refresh (the site's «تحديث الآن»: PMS yesterday + today, statements, this month's trial balances), month, backfill, discover, accounting (recent months), accounting-backfill (from 1 January) or accounting-2025 (last year's trial balances)"
        default: yesterday
        type: choice
        options: [yesterday, today, refresh, month, backfill, appointments, discover, accounting, accounting-backfill, accounting-2025]
      months:
        description: "Backfill: how many past months"
        default: "13"
      requested_by:
        description: "Who pressed «تحديث الآن» on the site (a Control Panel role), shown in the update log"
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: pms-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the browser (in its own folder, not the site's packages)
        run: |
          mkdir -p "$RUNNER_TEMP/robot"
          cp scripts/pms-robot.mjs scripts/robot-safety.mjs scripts/pms-robot.config.json "$RUNNER_TEMP/robot/"
          cd "$RUNNER_TEMP/robot"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.48.2 xlsx@0.18.5 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
      - name: Run the robot
        env:
          PMS_USER: ${{ secrets.PMS_USER }}
          PMS_PASSWORD: ${{ secrets.PMS_PASSWORD }}
          FINANCE_INGEST_KEY: ${{ secrets.FINANCE_INGEST_KEY }}
          ACCT_USER: ${{ secrets.ACCT_USER }}
          ACCT_PASSWORD: ${{ secrets.ACCT_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL || 'https://dentera.com.sa' }}
          MODE: ${{ inputs.mode || (github.event_name == 'push' && 'discover') || 'yesterday' }}
          MONTHS: ${{ inputs.months || '13' }}
          REQUESTED_BY: ${{ inputs.requested_by || '' }}
        working-directory: ${{ runner.temp }}/robot
        run: node pms-robot.mjs
